<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZATION GemERP</title>
    <style>
        :root {
            --background: #0B132B;
            --foreground: #F8FAFC;
            --primary: #D4AF37;
            --primary-light: #E6C84A;
            --primary-subtle: rgba(212, 175, 55, 0.08);
            --muted-foreground: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--foreground);
        }

        .preload-shell {
            position: relative;
            display: flex;
            min-height: 100vh;
            width: 100vw;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            overflow: hidden;
        }

        .preload-glow {
            position: absolute;
            top: 30%;
            left: 50%;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 65%);
            pointer-events: none;
        }

        .preload-logo {
            position: relative;
            z-index: 1;
            display: flex;
            width: 96px;
            height: 96px;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            background: var(--primary-subtle);
            box-shadow: 0 16px 40px rgba(212, 175, 55, 0.3), 0 4px 12px rgba(212, 175, 55, 0.15);
            animation: pulse 2.5s ease-in-out infinite;
        }

        .preload-logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
        }

        .preload-text {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .preload-text h1 {
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #F0D060 0%, #D4AF37 45%, #A67C00 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: 0;
            line-height: 1.2;
        }

        .preload-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }

        .preload-dots {
            display: flex;
            gap: 0.375rem;
        }

        .preload-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.2s ease-in-out infinite;
        }

        .preload-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .preload-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .preload-bar {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--primary-light), var(--primary), transparent);
            background-size: 200% 100%;
            animation: goldShimmer 2s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.9; }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes goldShimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <main class="preload-shell">
        <div class="preload-glow"></div>
        <div class="preload-logo">
            <img src="/logo-sidebar.png" alt="ZATION GemERP" />
        </div>
        <div class="preload-text">
            <h1>ZATION GemERP</h1>
            <div class="preload-status">
                <div class="preload-dots" aria-hidden="true">
                    <div class="preload-dot"></div>
                    <div class="preload-dot"></div>
                    <div class="preload-dot"></div>
                </div>
                <span>Initializing System...</span>
            </div>
        </div>
        <div class="preload-bar"></div>
    </main>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
