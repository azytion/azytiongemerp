services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_before_deploy}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zationgemerp}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - zation_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  zation_mysql_data:
